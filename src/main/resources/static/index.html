<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>banana shooter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at top, #1e293b, #0b0f19 80%);
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px 10px;
        }

        /* Large Banana Header */
        .header-title {
            font-size: clamp(3.5rem, 8vw, 6rem);
            font-weight: 900;
            letter-spacing: -2px;
            text-transform: lowercase;
            background: linear-gradient(135deg, #fef08a 0%, #facc15 45%, #ca8a04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 18px rgba(234, 179, 8, 0.45));
            margin-bottom: 8px;
            line-height: 1;
            text-align: center;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .game-wrapper {
            position: relative;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(250, 204, 21, 0.25);
            border-radius: 16px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7),
                        0 0 25px rgba(250, 204, 21, 0.1);
            backdrop-filter: blur(8px);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 95vw;
        }

        .hud {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px 14px 12px;
            font-size: 1rem;
            font-weight: 600;
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hud-val {
            color: #facc15;
            font-variant-numeric: tabular-nums;
        }

        .lives-container {
            font-size: 1.15rem;
            letter-spacing: 2px;
        }

        .audio-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .audio-btn:hover {
            background: #334155;
            color: #fff;
        }

        .canvas-container {
            position: relative;
            width: 640px;
            height: 460px;
            max-width: 100%;
            background: #030712;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
            border: 1px solid #1e293b;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* Overlay Screens */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(3, 7, 18, 0.82);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 10;
            transition: opacity 0.25s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #facc15;
            text-shadow: 0 0 16px rgba(250, 204, 21, 0.5);
        }

        .overlay-desc {
            color: #cbd5e1;
            font-size: 1rem;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }

        .btn-play {
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
            background: linear-gradient(135deg, #fde047 0%, #facc15 100%);
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(250, 204, 21, 0.4);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-play:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(250, 204, 21, 0.6);
        }

        .btn-play:active {
            transform: scale(0.98);
        }

        .controls-hint {
            margin-top: 14px;
            font-size: 0.82rem;
            color: #64748b;
            text-align: center;
        }

        .key-badge {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.78rem;
        }
    </style>
</head>
<body>

    <h1 class="header-title">first-prod!</h1>
    <p class="subtitle">Defend against the descending banana fleet</p>

    <div class="game-wrapper">
        <div class="hud">
            <div class="hud-item">
                <span>Score:</span>
                <span id="scoreVal" class="hud-val">0</span>
            </div>
            <div class="hud-item">
                <span>High:</span>
                <span id="highScoreVal" class="hud-val">0</span>
            </div>
            <div class="hud-item">
                <span id="livesContainer" class="lives-container">❤️❤️❤️</span>
            </div>
            <button id="audioToggle" class="audio-btn" aria-label="Toggle Sound">🔊 Sound</button>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="640" height="460"></canvas>

            <div id="startOverlay" class="overlay">
                <div class="overlay-title">Ready?</div>
                <div class="overlay-desc">Use mouse or arrow keys to aim and steer.<br>Click or press spacebar to fire lasers!</div>
                <button id="btnStart" class="btn-play">Start Game</button>
            </div>

            <div id="gameOverOverlay" class="overlay hidden">
                <div class="overlay-title">Game Over</div>
                <div class="overlay-desc" id="finalScoreText">Final Score: 0</div>
                <button id="btnRestart" class="btn-play">Play Again</button>
            </div>
        </div>

        <div class="controls-hint">
            <span class="key-badge">Mouse</span> / <span class="key-badge">←</span> <span class="key-badge">→</span> Move &bull;
            <span class="key-badge">Space</span> / <span class="key-badge">Click</span> Shoot &bull;
            <span class="key-badge">P</span> Pause
        </div>
    </div>

    <script>
        // --- Web Audio Synthesizer ---
        let audioCtx = null;
        let soundEnabled = true;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playShootSound() {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.12);
        }

        function playExplodeSound() {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(260, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.18);
            gain.gain.setValueAtTime(0.18, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.18);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.18);
        }

        function playDamageSound() {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(60, ctx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.25, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);
        }

        // --- Game Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('scoreVal');
        const highScoreVal = document.getElementById('highScoreVal');
        const livesContainer = document.getElementById('livesContainer');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreText = document.getElementById('finalScoreText');
        const btnStart = document.getElementById('btnStart');
        const btnRestart = document.getElementById('btnRestart');
        const audioToggle = document.getElementById('audioToggle');

        audioToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            audioToggle.textContent = soundEnabled ? '🔊 Sound' : '🔇 Muted';
        });

        const WIDTH = canvas.width;
        const HEIGHT = canvas.height;

        let score = 0;
        let highScore = parseInt(localStorage.getItem('banana_high_score') || '0', 10);
        highScoreVal.textContent = highScore;
        let lives = 3;
        let isRunning = false;
        let isPaused = false;
        let lastTime = 0;
        let spawnTimer = 0;
        let spawnInterval = 1100; // ms

        // Player state
        const player = {
            x: WIDTH / 2,
            y: HEIGHT - 35,
            width: 32,
            height: 28,
            speed: 380,
            targetX: WIDTH / 2
        };

        const bullets = [];
        const targets = [];
        const particles = [];
        const stars = [];

        // Generate background stars
        for (let i = 0; i < 45; i++) {
            stars.push({
                x: Math.random() * WIDTH,
                y: Math.random() * HEIGHT,
                size: Math.random() * 1.8 + 0.4,
                speed: Math.random() * 25 + 10,
                alpha: Math.random() * 0.7 + 0.3
            });
        }

        // Input handling
        const keys = {};
        let mouseX = WIDTH / 2;
        let shootCooldown = 0;

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyP' && isRunning) {
                isPaused = !isPaused;
            }
            if (e.code === 'Space') {
                e.preventDefault();
                if (!isRunning && !gameOverOverlay.classList.contains('hidden')) {
                    restartGame();
                } else if (!isRunning) {
                    startGame();
                } else {
                    tryShoot();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = WIDTH / rect.width;
            mouseX = (e.clientX - rect.left) * scaleX;
            player.targetX = Math.max(20, Math.min(WIDTH - 20, mouseX));
        });

        canvas.addEventListener('mousedown', () => {
            if (isRunning) {
                tryShoot();
            }
        });

        btnStart.addEventListener('click', startGame);
        btnRestart.addEventListener('click', restartGame);

        function tryShoot() {
            if (shootCooldown <= 0 && isRunning && !isPaused) {
                bullets.push({
                    x: player.x,
                    y: player.y - 14,
                    speed: 550,
                    radius: 3
                });
                playShootSound();
                shootCooldown = 0.16; // cooldown in seconds
            }
        }

        function createTarget() {
            const size = Math.random() * 12 + 22; // radius/size
            targets.push({
                x: Math.random() * (WIDTH - 80) + 40,
                y: -30,
                size: size,
                speed: Math.random() * 65 + 75 + Math.min(score * 1.5, 120),
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 3
            });
        }

        function spawnExplosion(x, y, color = '#facc15') {
            for (let i = 0; i < 14; i++) {
                const angle = Math.random() * Math.PI * 2;
                const spd = Math.random() * 140 + 40;
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    alpha: 1,
                    size: Math.random() * 3 + 2,
                    color: i % 2 === 0 ? color : '#ffffff'
                });
            }
        }

        function updateLivesDisplay() {
            let hearts = '';
            for (let i = 0; i < 3; i++) {
                hearts += i < lives ? '❤️' : '🖤';
            }
            livesContainer.textContent = hearts;
        }

        function startGame() {
            getAudioContext();
            score = 0;
            lives = 3;
            bullets.length = 0;
            targets.length = 0;
            particles.length = 0;
            spawnTimer = 0;
            spawnInterval = 1100;
            player.x = WIDTH / 2;
            player.targetX = WIDTH / 2;
            scoreVal.textContent = '0';
            updateLivesDisplay();
            isRunning = true;
            isPaused = false;
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function restartGame() {
            startGame();
        }

        function gameOver() {
            isRunning = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('banana_high_score', highScore);
                highScoreVal.textContent = highScore;
            }
            finalScoreText.textContent = `You scored ${score} points!`;
            gameOverOverlay.classList.remove('hidden');
        }

        // --- Render Helpers ---
        function drawBanana(x, y, size, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            const scale = size / 26;
            ctx.scale(scale, scale);

            // Banana curve
            ctx.beginPath();
            ctx.moveTo(-16, -10);
            ctx.bezierCurveTo(-4, -22, 16, -14, 22, 8);
            ctx.bezierCurveTo(12, 0, -4, 4, -16, -10);
            ctx.fillStyle = '#facc15';
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#eab308';
            ctx.stroke();

            // Banana stem
            ctx.beginPath();
            ctx.moveTo(-16, -10);
            ctx.lineTo(-21, -12);
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#4d7c0f';
            ctx.stroke();

            // Tip
            ctx.beginPath();
            ctx.moveTo(22, 8);
            ctx.lineTo(25, 10);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#78350f';
            ctx.stroke();

            ctx.restore();
        }

        function drawShip(x, y) {
            ctx.save();
            ctx.translate(x, y);

            // Engine Flame
            ctx.beginPath();
            ctx.moveTo(-6, 10);
            ctx.lineTo(0, 16 + Math.random() * 6);
            ctx.lineTo(6, 10);
            ctx.fillStyle = '#38bdf8';
            ctx.fill();

            // Ship Hull
            ctx.beginPath();
            ctx.moveTo(0, -16);
            ctx.lineTo(15, 10);
            ctx.lineTo(0, 5);
            ctx.lineTo(-15, 10);
            ctx.closePath();
            ctx.fillStyle = '#0284c7';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#38bdf8';
            ctx.stroke();

            // Cockpit dome
            ctx.beginPath();
            ctx.arc(0, -1, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = '#e0f2fe';
            ctx.fill();

            ctx.restore();
        }

        // --- Main Game Loop ---
        function gameLoop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            if (!isRunning) return;

            if (!isPaused) {
                // Background starfield
                for (const star of stars) {
                    star.y += star.speed * dt;
                    if (star.y > HEIGHT) {
                        star.y = 0;
                        star.x = Math.random() * WIDTH;
                    }
                }

                // Keyboard movement
                let moveDir = 0;
                if (keys['ArrowLeft'] || keys['KeyA']) moveDir -= 1;
                if (keys['ArrowRight'] || keys['KeyD']) moveDir += 1;

                if (moveDir !== 0) {
                    player.x += moveDir * player.speed * dt;
                    player.x = Math.max(18, Math.min(WIDTH - 18, player.x));
                    player.targetX = player.x;
                } else {
                    // Smooth lerp to mouse position
                    player.x += (player.targetX - player.x) * 0.25;
                }

                // Shoot cooldown
                if (shootCooldown > 0) {
                    shootCooldown -= dt;
                }

                // Bullets update
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    b.y -= b.speed * dt;
                    if (b.y < -10) {
                        bullets.splice(i, 1);
                    }
                }

                // Spawn targets
                spawnTimer += dt * 1000;
                if (spawnTimer >= spawnInterval) {
                    spawnTimer = 0;
                    createTarget();
                    // Gradual spawn acceleration
                    if (spawnInterval > 420) {
                        spawnInterval -= 10;
                    }
                }

                // Targets update & collisions
                for (let i = targets.length - 1; i >= 0; i--) {
                    const t = targets[i];
                    t.y += t.speed * dt;
                    t.rotation += t.rotSpeed * dt;

                    // Check bullet hits
                    let hit = false;
                    for (let j = bullets.length - 1; j >= 0; j--) {
                        const b = bullets[j];
                        const dist = Math.hypot(b.x - t.x, b.y - t.y);
                        if (dist < t.size + 4) {
                            spawnExplosion(t.x, t.y, '#facc15');
                            playExplodeSound();
                            bullets.splice(j, 1);
                            targets.splice(i, 1);
                            score += 10;
                            scoreVal.textContent = score;
                            hit = true;
                            break;
                        }
                    }

                    if (hit) continue;

                    // Reached bottom
                    if (t.y > HEIGHT + 20) {
                        targets.splice(i, 1);
                        lives -= 1;
                        playDamageSound();
                        updateLivesDisplay();
                        if (lives <= 0) {
                            gameOver();
                            return;
                        }
                    }
                }

                // Particles update
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.alpha -= dt * 2.2;
                    if (p.alpha <= 0) {
                        particles.splice(i, 1);
                    }
                }
            }

            // --- Draw Frame ---
            ctx.clearRect(0, 0, WIDTH, HEIGHT);

            // Stars
            for (const star of stars) {
                ctx.fillStyle = `rgba(226, 232, 240, ${star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }

            // Bullets
            for (const b of bullets) {
                ctx.save();
                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 8;
                ctx.fillRect(b.x - 2, b.y, 4, 12);
                ctx.restore();
            }

            // Targets (bananas)
            for (const t of targets) {
                drawBanana(t.x, t.y, t.size, t.rotation);
            }

            // Particles
            for (const p of particles) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Player Ship
            drawShip(player.x, player.y);

            // Paused indicator
            if (isPaused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
                ctx.fillStyle = '#facc15';
                ctx.font = '700 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSED', WIDTH / 2, HEIGHT / 2);
            }

            requestAnimationFrame(gameLoop);
        }

        // Draw initial teaser screen
        (function renderPreview() {
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            for (const star of stars) {
                ctx.fillStyle = `rgba(226, 232, 240, ${star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }
            drawShip(WIDTH / 2, HEIGHT - 35);
            drawBanana(WIDTH / 2 - 100, 120, 26, 0.4);
            drawBanana(WIDTH / 2 + 100, 160, 24, -0.6);
            drawBanana(WIDTH / 2, 80, 28, 0.1);
        })();
    </script>
</body>
</html>
